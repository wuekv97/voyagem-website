<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="news.title_tag">Новости — voyageM!</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg?v=4">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=4">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=4">
  <link rel="stylesheet" href="styles.css?v=17">
  <script>
    (function(){ var s=localStorage.getItem('vm_theme'); if(!s) s=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; document.documentElement.dataset.theme=s; })();
  </script>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="nav-host"></div>

  <main>
    <section class="hero" style="padding: 64px 0 20px;">
      <div class="container">
        <div class="hero-kicker"><span class="hero-kicker-dot"></span><span data-i18n="news.kicker">Блог проекта</span></div>
        <h1 style="font-size: clamp(36px, 5vw, 52px);" data-i18n-html="news.title">Новости <em>voyageM!</em></h1>
        <p class="lead" data-i18n="news.lead">Обновления сервера, анонсы ивентов, патч-ноуты и всё, что происходит в мире.</p>
      </div>
    </section>

    <section class="section" style="padding-top: 20px;">
      <div class="container">
        <div class="news-list" id="news-list"></div>
      </div>
    </section>
  </main>

  <div id="footer-host"></div>
  <script src="i18n.js?v=17"></script>
  <script src="partials.js?v=17"></script>
  <script type="module" src="scene.js?v=17"></script>
  <script>
    mount('news.html');

    const NEWS_RU = [
      { date: '17 апр 2026', tag: 'news.tag_announce', title: 'Запуск сезона «Terra»', excerpt: 'Новый мир с уникальным генератором Terra, спавн у координат 0,0 и стартовые киты для первых 100 игроков. Сид 42 — тот самый ответ на всё.' },
      { date: '12 апр 2026', tag: 'news.tag_patch',    title: 'Обновление до Paper 1.21.4-232', excerpt: 'Перешли на свежую сборку. Исправили баги с загрузкой чанков на view-distance 16, улучшили производительность при 20+ игроках.' },
      { date: '10 апр 2026', tag: 'news.tag_feat',     title: 'BlueMap теперь в реальном времени', excerpt: 'Живая карта мира обновляется автоматически. Смотрите построения друзей прямо в браузере — ссылка в разделе «Серверы».' },
      { date: '05 апр 2026', tag: 'news.tag_event',    title: 'Турнир «Мастер выживания»', excerpt: 'Каждую субботу в 20:00 — испытания на скорость и смекалку. Призы: VIP на месяц и место в Зале Славы.' },
      { date: '01 апр 2026', tag: 'news.tag_release',  title: 'FastLogin: поддержка пиратов включена', excerpt: 'Теперь на сервер можно заходить как с лицензионного аккаунта, так и без. Имена защищены паролем через AuthMe.' },
      { date: '28 мар 2026', tag: 'news.tag_admin',    title: 'LuckPerms + группы игроков', excerpt: 'Настроили систему прав. Админский состав получил отдельную группу, остальные игроки — стандартные права выживания.' },
      { date: '24 мар 2026', tag: 'news.tag_community', title: 'Запуск воркшопа по редстоуну', excerpt: 'Присоединяйтесь к мастер-классам по автоматизации ферм. Делимся схемами в Discord-канале.' },
    ];
    const NEWS_EN = [
      { date: 'Apr 17, 2026', tag: 'news.tag_announce', title: 'Season "Terra" launch', excerpt: 'New world on the unique Terra generator, spawn at 0,0, and starter kits for the first 100 players. Seed 42 — yes, that one.' },
      { date: 'Apr 12, 2026', tag: 'news.tag_patch',    title: 'Updated to Paper 1.21.4-232', excerpt: 'Switched to the latest build. Fixed chunk-load bugs at view-distance 16; better performance at 20+ players.' },
      { date: 'Apr 10, 2026', tag: 'news.tag_feat',     title: 'BlueMap is now real-time', excerpt: 'The live world map updates automatically. Browse friends\' builds right in the browser — link in the "Servers" section.' },
      { date: 'Apr 05, 2026', tag: 'news.tag_event',    title: 'Tournament "Master of Survival"', excerpt: 'Every Saturday at 20:00 — speed and skill challenges. Prizes: VIP for a month and a slot in the Hall of Fame.' },
      { date: 'Apr 01, 2026', tag: 'news.tag_release',  title: 'FastLogin: cracked-client support enabled', excerpt: 'You can now join the server with a legit Mojang account or without one. Names are protected by an AuthMe password.' },
      { date: 'Mar 28, 2026', tag: 'news.tag_admin',    title: 'LuckPerms + player groups', excerpt: 'Set up the permission system. Admins got a dedicated group; everyone else has standard survival permissions.' },
      { date: 'Mar 24, 2026', tag: 'news.tag_community', title: 'Redstone workshop kicks off', excerpt: 'Join the workshops on farm automation. Schematics are shared in the Discord channel.' },
    ];

    function render() {
      const lang = (localStorage.getItem('vm_lang') === 'en') ? 'en' : 'ru';
      const items = lang === 'en' ? NEWS_EN : NEWS_RU;
      document.getElementById('news-list').innerHTML = items.map(n => `
        <article class="news-item">
          <div class="news-date">${n.date}</div>
          <div>
            <div class="news-title">${n.title}</div>
            <div class="news-excerpt">${n.excerpt}</div>
          </div>
          <span class="news-tag">${t(n.tag)}</span>
        </article>`).join('');
    }
    render();
  </script>
</body>
</html>
