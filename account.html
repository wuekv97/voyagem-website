<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="account.title_tag">Личный кабинет — voyageM!</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=2">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="styles.css?v=10">
  <script>
    (function(){ var s=localStorage.getItem('vm_theme'); if(!s) s=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; document.documentElement.dataset.theme=s; })();
  </script>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="nav-host"></div>

  <main>
    <div class="container" id="account-host"></div>
  </main>

  <div id="footer-host"></div>
  <script src="i18n.js?v=10"></script>
  <script src="partials.js?v=10"></script>
  <script type="module" src="scene.js?v=10"></script>
  <script>
    mount('account.html');

    const host = document.getElementById('account-host');

    function getUser() {
      const raw = localStorage.getItem('vm_user_data');
      return raw ? JSON.parse(raw) : null;
    }
    function saveUser(data) {
      localStorage.setItem('vm_user', data.nick);
      localStorage.setItem('vm_user_data', JSON.stringify(data));
    }
    function logout() {
      localStorage.removeItem('vm_user');
      localStorage.removeItem('vm_user_data');
      location.reload();
    }

    function renderLogin() {
      host.innerHTML = `
        <div class="login-wrap">
          <h2>${t('account.login_title')}</h2>
          <p>${t('account.login_lead')}</p>
          <label for="nick">${t('account.nick_label')}</label>
          <input id="nick" type="text" placeholder="${t('account.nick_ph')}" autocomplete="username" required>
          <label for="pwd">${t('account.pwd_label')}</label>
          <input id="pwd" type="password" placeholder="${t('account.pwd_ph')}" autocomplete="current-password" required>
          <p id="login-error" style="color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 8px;"></p>
          <button class="btn btn-primary btn-lg" id="login-btn">${t('account.login_btn')}</button>
          <p class="login-hint">${t('account.login_hint')}</p>
        </div>`;
      document.getElementById('login-btn').onclick = async () => {
        const nick = document.getElementById('nick').value.trim();
        const pwd = document.getElementById('pwd').value;
        if (nick.length < 3) { alert(t('account.err_short')); return; }
        if (pwd.length < 4) { alert(t('account.err_pwd')); return; }
        const btn = document.getElementById('login-btn');
        const errEl = document.getElementById('login-error');
        btn.disabled = true; btn.textContent = t('account.login_check');
        errEl.textContent = '';
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: nick, password: pwd })
          });
          const data = await res.json();
          if (!res.ok) {
            errEl.textContent = data.error || t('account.err_login');
            btn.disabled = false; btn.textContent = t('account.login_btn');
            return;
          }
          saveUser({
            nick: data.username,
            token: data.token,
            joined: data.regdate ? new Date(Number(data.regdate)).toISOString().slice(0, 10) : new Date().toISOString().slice(0, 10),
            lastlogin: data.lastlogin ? new Date(Number(data.lastlogin)).toISOString().slice(0, 10) : null,
          });
          location.reload();
        } catch {
          errEl.textContent = t('account.err_conn');
          btn.disabled = false; btn.textContent = t('account.login_btn');
        }
      };
    }

    // ---------- Formatters ----------
    const nf = new Intl.NumberFormat(LANG === 'en' ? 'en-US' : 'ru-RU');
    const fmt = (n) => nf.format(Math.round(n || 0));
    function fmtKm(cm) {
      const km = (cm || 0) / 100000;
      if (km >= 10) return fmt(km) + ' ' + t('account.km');
      if (km >= 1) return km.toFixed(2) + ' ' + t('account.km');
      const m = Math.round((cm || 0) / 100);
      return fmt(m) + ' ' + t('account.m');
    }
    function fmtDuration(seconds) {
      const s = seconds || 0;
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      if (d > 0) return `${d}${t('account.d')} ${h}${t('account.h')}`;
      if (h > 0) return `${h}${t('account.h')} ${m}${t('account.m_time')}`;
      return `${m}${t('account.m_time')}`;
    }
    function fmtMcKey(key) {
      if (!key) return '—';
      return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    // ---------- Icons (inline SVG) ----------
    const ICON = {
      sword:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/></svg>',
      shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
      compass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>',
      cube:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-9 5-9-5V8l9-5 9 5z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
      heart:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>',
      clock:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
      skull:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><path d="M8 20v2h8v-2"/><path d="m12.5 17-.5-1-.5 1h1z"/><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/></svg>',
      foot:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-2a8 8 0 0 1 16 0v2"/><path d="M2 16h20l-2 6H4z"/></svg>',
      bird:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h.01"/><path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20"/><path d="m20 7 2 .5-2 .5"/><path d="M10 18v3"/><path d="M14 17.75V21"/><path d="M7 18a6 6 0 0 0 3.84-10.61"/></svg>',
      wave:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6c.6.5 1.2 1 2.5 1S6.9 6.5 7.5 6s1.2-1 2.5-1 1.9.5 2.5 1 1.2 1 2.5 1 1.9-.5 2.5-1 1.2-1 2.5-1c1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1s1.9-.5 2.5-1 1.2-1 2.5-1 1.9.5 2.5 1 1.2 1 2.5 1 1.9-.5 2.5-1 1.2-1 2.5-1c1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1s1.9-.5 2.5-1 1.2-1 2.5-1 1.9.5 2.5 1 1.2 1 2.5 1 1.9-.5 2.5-1 1.2-1 2.5-1c1.3 0 1.9.5 2.5 1"/></svg>',
      horse:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1h-2.5"/><path d="m20.5 17 .5-1 .5 1"/><path d="M14 4h-4.5a2.5 2.5 0 0 0 0 5 2.5 2.5 0 0 1 0 5H3"/><path d="M4 17h4v4H4z"/><path d="M20 21h-4v-4"/><path d="m7 11 7 5"/></svg>',
      pickaxe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 9.5 21 3l-2-2-6.5 6.5"/><path d="m13 8 3 3"/><path d="m18 5 1 1"/><path d="M5 21h14a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z"/><path d="m9.5 14.5 2.5 4.5"/><path d="m3 21 6-6"/></svg>',
      stack:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
      hammer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-8.5 8.5c-.83.83-2.17.83-3 0 0 0 0 0 0 0a2.12 2.12 0 0 1 0-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16.01 4.6a5.56 5.56 0 0 0-3.94-1.64H9l.92.82A6.18 6.18 0 0 1 12 8.4v1.56l2 2h2.47l2.26 1.91"/></svg>',
      hand:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>',
      arrow:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>',
      fish:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/><path d="M18 12v.5"/><path d="M16 17.93a9.77 9.77 0 0 1 0-11.86"/><path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33"/><path d="M10.46 7.26C10.2 5.88 9.17 4.24 8 3h5.8a2 2 0 0 1 1.98 1.67l.23 1.4"/><path d="m16.01 17.93-.23 1.4A2 2 0 0 1 13.8 21H9.5a5.96 5.96 0 0 0 1.49-3.98"/></svg>',
      paw:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>',
      bed:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>',
      moon:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
      door:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v14"/><path d="M2 20h20"/><path d="M14 12v.01"/></svg>',
    };

    function statCard(opts) {
      const { icon, value, label, sub, accent } = opts;
      return `<div class="stat-card ${accent ? 'stat-card-accent' : ''}">
        <div class="stat-card-head">
          ${icon ? `<span class="stat-card-icon">${icon}</span>` : ''}
          <span class="stat-card-label">${label}</span>
        </div>
        <div class="stat-card-value">${value}</div>
        ${sub ? `<div class="stat-card-sub">${sub}</div>` : ''}
      </div>`;
    }

    function featureCard(opts) {
      const { icon, value, label, sub } = opts;
      return `<div class="stat-feature">
        <span class="stat-feature-icon">${icon}</span>
        <div>
          <div class="stat-feature-value">${value}</div>
          <div class="stat-feature-label">${label}</div>
          ${sub ? `<div class="stat-feature-sub">${sub}</div>` : ''}
        </div>
      </div>`;
    }

    function statsSection(title, eyebrow, cardsHtml) {
      return `
        <section class="stats-section">
          <header class="stats-section-head">
            <span class="stats-section-eyebrow">${eyebrow}</span>
            <h3>${title}</h3>
          </header>
          <div class="stats-grid">${cardsHtml}</div>
        </section>`;
    }

    async function renderDashboard(user) {
      // Skeleton first
      host.innerHTML = `
        <div class="account-grid-simple">
          <div class="profile-header card">
            <img class="profile-avatar" src="https://mc-heads.net/avatar/${user.nick}/96" alt=""
              onerror="this.style.display='none'">
            <div class="profile-meta">
              <h2>${user.nick}</h2>
              <p class="profile-sub" id="profile-sub">${t('account.loading_stats')}</p>
            </div>
            <button class="btn btn-ghost btn-logout" id="btn-logout">${t('account.tab_logout')}</button>
          </div>
          <div id="stats-host"></div>
        </div>`;
      document.getElementById('btn-logout').onclick = logout;

      let s = null;
      try {
        const res = await fetch('/api/stats/' + encodeURIComponent(user.nick));
        if (res.ok) s = await res.json();
      } catch {}

      const locale = LANG === 'en' ? 'en-US' : 'ru-RU';
      const subParts = [];
      if (s?.regdate) subParts.push(`${t('account.reg_date')}: ${new Date(s.regdate).toLocaleDateString(locale)}`);
      else if (user.joined) subParts.push(`${t('account.reg_date')}: ${user.joined}`);
      if (s?.lastlogin) subParts.push(`${t('account.last_login')}: ${new Date(s.lastlogin).toLocaleDateString(locale)}`);
      document.getElementById('profile-sub').textContent = subParts.join(' · ') || '—';

      const statsHost = document.getElementById('stats-host');
      if (!s) {
        statsHost.innerHTML = `<div class="card account-section"><p style="color: var(--text-muted);">${t('account.stats_offline')}</p></div>`;
        return;
      }
      if (!s.exists) {
        statsHost.innerHTML = `
          <div class="card account-section empty-state">
            <h3>${t('account.no_stats_title')}</h3>
            <p>${t('account.no_stats_lead')}</p>
            <a class="btn btn-primary" href="download.html">${t('account.quick_dl')}</a>
          </div>`;
        return;
      }

      // ---- Hero summary (3 prominent cards) ----
      const summary = `
        <section class="stats-summary">
          ${featureCard({
            icon: ICON.clock,
            value: fmtDuration(s.playSeconds),
            label: t('stat.play_time'),
            sub: s.leftGame ? `${fmt(s.leftGame)} ${t('stat.sessions')}` : null,
          })}
          ${featureCard({
            icon: ICON.skull,
            value: fmt(s.deaths),
            label: t('stat.deaths'),
            sub: s.deaths ? `${t('stat.since_last')} ${fmtDuration(s.timeSinceDeath)}` : null,
          })}
          ${featureCard({
            icon: ICON.sword,
            value: fmt(s.mobsKilledTotal || s.mobKills),
            label: t('stat.mobs_killed'),
            sub: s.topKilled ? `${fmtMcKey(s.topKilled)} ×${fmt(s.topKilledCount)}` : null,
          })}
        </section>`;

      // ---- Section: Combat ----
      const combat = statsSection(
        t('stats.section_combat'), t('stats.section_combat_eyebrow'),
        [
          statCard({ icon: ICON.arrow,  value: fmt(s.playerKills),       label: t('stat.player_kills') }),
          statCard({ icon: ICON.shield, value: fmt(s.damageDealt),       label: t('stat.damage_dealt'), sub: `${t('stat.taken')}: ${fmt(s.damageTaken)}` }),
          statCard({ icon: ICON.foot,   value: fmt(s.jumps),             label: t('stat.jumps') }),
        ].join('')
      );

      // ---- Section: Movement ----
      const movement = statsSection(
        t('stats.section_move'), t('stats.section_move_eyebrow'),
        [
          statCard({ icon: ICON.compass, value: fmtKm(s.walkCm + s.sprintCm), label: t('stat.walked'), sub: `${t('stat.sprinted')}: ${fmtKm(s.sprintCm)}` }),
          statCard({ icon: ICON.bird,    value: fmtKm(s.flyCm),               label: t('stat.flown') }),
          statCard({ icon: ICON.wave,    value: fmtKm(s.swimCm),              label: t('stat.swam') }),
          statCard({ icon: ICON.horse,   value: fmtKm(s.boatCm + s.horseCm),  label: t('stat.rode') }),
        ].join('')
      );

      // ---- Section: World ----
      const world = statsSection(
        t('stats.section_world'), t('stats.section_world_eyebrow'),
        [
          statCard({ icon: ICON.pickaxe, value: fmt(s.blocksMined),  label: t('stat.blocks_mined'),    sub: s.topMined ? `${fmtMcKey(s.topMined)} ×${fmt(s.topMinedCount)}` : null }),
          statCard({ icon: ICON.cube,    value: fmt(s.blocksPlaced), label: t('stat.blocks_placed'),   sub: s.topUsed ? `${fmtMcKey(s.topUsed)} ×${fmt(s.topUsedCount)}` : null }),
          statCard({ icon: ICON.hammer,  value: fmt(s.itemsCrafted), label: t('stat.items_crafted') }),
          statCard({ icon: ICON.hand,    value: fmt(s.itemsPickedUp),label: t('stat.items_picked_up') }),
        ].join('')
      );

      // ---- Section: Life ----
      const life = statsSection(
        t('stats.section_life'), t('stats.section_life_eyebrow'),
        [
          statCard({ icon: ICON.fish, value: fmt(s.fishCaught), label: t('stat.fish') }),
          statCard({ icon: ICON.paw,  value: fmt(s.animalsBred), label: t('stat.bred') }),
          statCard({ icon: ICON.bed,  value: fmt(s.bedsSlept),   label: t('stat.beds') }),
          statCard({ icon: ICON.moon, value: fmtDuration(s.timeSinceRest), label: t('stat.since_rest') }),
        ].join('')
      );

      // ---- Skin ----
      const skin = `
        <section class="stats-section">
          <header class="stats-section-head">
            <span class="stats-section-eyebrow">${t('skin.eyebrow')}</span>
            <h3>${t('skin.title')}</h3>
          </header>
          <div class="skin-grid">
            <div class="skin-preview">
              <div class="skin-preview-head">
                <canvas id="skin-canvas" width="160" height="320"></canvas>
              </div>
              <div class="skin-preview-meta">
                <strong>${user.nick}</strong>
                <span id="skin-status">${t('skin.current')}</span>
              </div>
            </div>
            <div class="skin-upload">
              <label class="skin-drop" id="skin-drop">
                <input type="file" id="skin-file" accept="image/png" hidden>
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <strong>${t('skin.drop_title')}</strong>
                <span>${t('skin.drop_hint')}</span>
              </label>
              <div class="skin-actions">
                <button class="btn btn-primary" id="skin-submit" disabled>${t('skin.submit')}</button>
                <button class="btn btn-ghost" id="skin-reset">${t('skin.reset')}</button>
              </div>
              <p class="skin-msg" id="skin-msg"></p>
            </div>
          </div>
        </section>`;

      // ---- Quick access ----
      const quick = `
        <section class="stats-section">
          <header class="stats-section-head">
            <span class="stats-section-eyebrow">${t('stats.quick_eyebrow')}</span>
            <h3>${t('account.quick_title')}</h3>
          </header>
          <div class="quick-grid">
            <a class="btn btn-ghost" href="status.html">${t('account.quick_map')}</a>
            <a class="btn btn-ghost" href="status.html">${t('account.quick_status')}</a>
            <a class="btn btn-ghost" href="news.html">${t('account.quick_news')}</a>
            <a class="btn btn-ghost" href="download.html">${t('account.quick_dl')}</a>
          </div>
        </section>`;

      statsHost.innerHTML = summary + combat + movement + world + life + skin + quick;
      wireSkinUpload(user);
    }

    // Render a Minecraft 64×64 or 64×32 skin texture as a front-facing body on canvas
    function renderSkinToCanvas(canvas, img) {
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Logical body: 16 wide × 32 tall (head=8×8, body=8×12, arms=4×12, legs=4×12)
      const LW = 16, LH = 32;
      const px = Math.floor(Math.min(canvas.width / LW, canvas.height / LH));
      const offX = Math.floor((canvas.width - LW * px) / 2);
      const offY = Math.floor((canvas.height - LH * px) / 2);
      const slim = false;

      function blit(sx, sy, sw, sh, dx, dy, flip) {
        if (flip) {
          ctx.save();
          ctx.translate((offX + (dx + sw) * px), 0);
          ctx.scale(-1, 1);
          ctx.drawImage(img, sx, sy, sw, sh, 0, offY + dy * px, sw * px, sh * px);
          ctx.restore();
        } else {
          ctx.drawImage(img, sx, sy, sw, sh, offX + dx * px, offY + dy * px, sw * px, sh * px);
        }
      }

      // Base layers
      blit(8, 8, 8, 8, 4, 0);            // head front
      blit(20, 20, 8, 12, 4, 8);         // body front
      blit(44, 20, 4, 12, 0, 8);         // right arm front
      blit(4, 20, 4, 12, 4, 20);         // right leg front
      const has64h = img.height === 64;
      if (has64h) {
        blit(36, 52, 4, 12, 12, 8);      // left arm front
        blit(20, 52, 4, 12, 8, 20);      // left leg front
      } else {
        // 64×32 legacy: mirror right side
        blit(44, 20, 4, 12, 12, 8, true);
        blit(4, 20, 4, 12, 8, 20, true);
      }
      // Overlay layers (hat / jacket / sleeves / pants) — only for 64×64
      if (has64h) {
        blit(40, 8, 8, 8, 4, 0);         // hat
        blit(20, 36, 8, 12, 4, 8);       // jacket
        blit(44, 36, 4, 12, 0, 8);       // right sleeve
        blit(52, 52, 4, 12, 12, 8);      // left sleeve
        blit(4, 36, 4, 12, 4, 20);       // right pant
        blit(4, 52, 4, 12, 8, 20);       // left pant
      }
    }

    async function loadImg(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function refreshPreview(user, sourceUrl) {
      const canvas = document.getElementById('skin-canvas');
      if (!canvas) return;
      const urls = sourceUrl
        ? [sourceUrl]
        : [`/api/skin/${user.nick}.png?t=${Date.now()}`, `https://mc-heads.net/skin/${user.nick}`];
      for (const url of urls) {
        try {
          const img = await loadImg(url);
          renderSkinToCanvas(canvas, img);
          return;
        } catch {}
      }
      // Fallback: leave canvas empty with placeholder text
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#a1a1aa';
      ctx.font = '72px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('?', canvas.width / 2, canvas.height / 2);
    }

    function wireSkinUpload(user) {
      const drop = document.getElementById('skin-drop');
      const fileIn = document.getElementById('skin-file');
      const submit = document.getElementById('skin-submit');
      const reset = document.getElementById('skin-reset');
      const msg = document.getElementById('skin-msg');
      const status = document.getElementById('skin-status');
      let chosen = null;
      let chosenObjectUrl = null;

      function setMsg(text, kind) {
        msg.textContent = text || '';
        msg.dataset.kind = kind || '';
      }

      refreshPreview(user);

      function setFile(f) {
        if (chosenObjectUrl) { URL.revokeObjectURL(chosenObjectUrl); chosenObjectUrl = null; }
        if (!f) { chosen = null; submit.disabled = true; drop.classList.remove('has-file'); setMsg(''); return; }
        if (f.type !== 'image/png') { setMsg(t('skin.err_format'), 'err'); return; }
        if (f.size > 200_000) { setMsg(t('skin.err_size'), 'err'); return; }
        const img = new Image();
        img.onload = () => {
          if (!((img.width === 64 && img.height === 64) || (img.width === 64 && img.height === 32))) {
            setMsg(t('skin.err_dims'), 'err'); return;
          }
          chosen = f; submit.disabled = false;
          drop.classList.add('has-file');
          drop.querySelector('strong').textContent = f.name;
          drop.querySelector('span').textContent = `${img.width}×${img.height} · ${(f.size/1024).toFixed(1)} KB`;
          setMsg(t('skin.ready'), 'ok');
          // Live preview of the chosen file before submit
          renderSkinToCanvas(document.getElementById('skin-canvas'), img);
          status.textContent = t('skin.preview_pending');
        };
        img.onerror = () => setMsg(t('skin.err_format'), 'err');
        chosenObjectUrl = URL.createObjectURL(f);
        img.src = chosenObjectUrl;
      }

      fileIn.onchange = () => setFile(fileIn.files[0]);
      drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('drag'); };
      drop.ondragleave = () => drop.classList.remove('drag');
      drop.ondrop = (e) => {
        e.preventDefault();
        drop.classList.remove('drag');
        setFile(e.dataTransfer.files[0]);
      };

      reset.onclick = () => {
        fileIn.value = ''; setFile(null);
        drop.querySelector('strong').textContent = t('skin.drop_title');
        drop.querySelector('span').textContent = t('skin.drop_hint');
        status.textContent = t('skin.current');
        refreshPreview(user);
      };

      submit.onclick = async () => {
        if (!chosen) return;
        submit.disabled = true; submit.textContent = t('skin.uploading');
        setMsg('');
        try {
          const fd = new FormData();
          fd.append('skin', chosen);
          fd.append('token', user.token || '');
          const res = await fetch('/api/skin', { method: 'POST', body: fd });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            setMsg(data.error || t('skin.err_upload'), 'err');
            submit.disabled = false; submit.textContent = t('skin.submit');
            return;
          }
          setMsg(data.applied ? t('skin.applied') : (data.hint || t('skin.uploaded')), 'ok');
          submit.textContent = t('skin.submit');
          // Refresh preview from the server's stored copy
          await refreshPreview(user, `/api/skin/${user.nick}.png?t=${Date.now()}`);
          status.textContent = data.applied ? t('skin.applied_label') : t('skin.queued_label');
        } catch {
          setMsg(t('skin.err_conn'), 'err');
          submit.disabled = false; submit.textContent = t('skin.submit');
        }
      };
    }

    const u = getUser();
    if (u) renderDashboard(u);
    else renderLogin();
  </script>
</body>
</html>
